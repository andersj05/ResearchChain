[project]
name = "researchchain-api"
version = "0.1.0"
description = "Validated workflow execution for ResearchChain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "langgraph>=1,<2",
  "pydantic>=2.12,<3",
  "uvicorn>=0.38,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchchain"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.18,<2", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
